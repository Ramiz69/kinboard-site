<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1a1f2b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f3ea" media="(prefers-color-scheme: light)">
<title>{{title}}</title>
{{head}}
<meta name="apple-itunes-app" content="app-id={{appId}}">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="{{css}}">
<script src="{{@js/theme-init.js}}"></script>
<script type="module" src="{{@js/menus.js}}"></script>
{{jsonld}}
</head>
<body class="{{bodyClass}}">
<a class="skip" href="#main">{{ui.skip}}</a>
<header class="top">
  <div class="bar">
    <a class="brand" href="{{hrefs.home}}"{{current.home}}>{{logo}}<span>Kinboard</span></a>
    <nav class="topnav" aria-label="{{ui.language}} · {{ui.theme.label}}">
    {{menus}}
    </nav>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="foot">
  <div class="wrap foot-in">
    <nav class="site" aria-label="{{ui.siteNav}}">
      <a href="{{hrefs.home}}"{{current.home}}>{{ui.home}}</a>
      <a href="{{hrefs.support}}"{{current.support}}>{{ui.support}}</a>
      <a href="{{hrefs.privacy}}"{{current.privacy}}>{{ui.privacy}}</a>
      <a href="{{hrefs.press}}"{{current.press}} hreflang="en">{{ui.press}}</a>
    </nav>
    <p class="legal">{{ui.copyright}} · {{ui.trademarks}}</p>
  </div>
</footer>
</body>
</html>
